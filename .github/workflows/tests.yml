name: unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Windows x86 / ${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, devel, release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'

      - name: configure standalone tests
        run: xmake f -p windows -a x86 -m ${{ matrix.mode }} --game=n --tests=y -y

      - name: build tests
        run: xmake build -v tests

      - name: run tests
        timeout-minutes: 2
        run: python scripts/run_tests.py build/windows/x86/${{ matrix.mode }}/tests.exe

      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.mode }}
          path: build/test-results/*.log
          if-no-files-found: ignore
