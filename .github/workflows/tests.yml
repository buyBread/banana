name: unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Windows x86 / ${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, devel, release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'

      - name: configure standalone tests
        run: xmake f -p windows -a x86 -m ${{ matrix.mode }} --game=n --tests=y -y

      - name: run tests
        run: xmake test -v

      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.mode }}
          path: build/.gens/tests/**/tests/**
          include-hidden-files: true
          if-no-files-found: ignore
