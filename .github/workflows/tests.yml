name: unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Windows x86 / ${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, devel, release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'

      - name: configure standalone tests
        run: xmake f -p windows -a x86 -m ${{ matrix.mode }} --game=n --tests=y -y

      - name: build tests
        run: xmake build -v tests

      - name: run tests
        timeout-minutes: 2
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $test_executable = ".\build\windows\x86\${{ matrix.mode }}\tests.exe"
          New-Item -ItemType Directory -Force -Path build/test-results | Out-Null
          $failed = $false

          foreach ($category in @("hash", "mash")) {
            Write-Host "::group::$category"
            $output = & $test_executable "--test-suite=$category" --no-colors --no-breaks --order-by=name 2>&1 |
              Tee-Object -FilePath "build/test-results/$category.log"
            $test_exit_code = $LASTEXITCODE
            $output | Write-Output
            Write-Host "::endgroup::"

            if ($test_exit_code -ne 0 -or ($output -join "`n") -notmatch '\[doctest\] test cases:\s+[1-9]\d*\s+\|') {
              Write-Host "::error::$category failed or selected no test cases; exit code $test_exit_code"
              $failed = $true
            }
          }

          if ($failed) { exit 1 }

      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.mode }}
          path: build/test-results/*.log
          if-no-files-found: ignore
